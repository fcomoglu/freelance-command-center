version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Expo pins compatible versions; upgrade with `npx expo install --fix` instead.
      - dependency-name: 'expo*'
      - dependency-name: 'react-native*'
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
