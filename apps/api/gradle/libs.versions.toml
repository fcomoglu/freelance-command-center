# Versions for dependencies that are not managed by the Spring Boot / Spring Modulith BOMs.
[versions]
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
spring-modulith = "2.1.1"
springdoc = "3.2.0"
anthropic = "3.10.0"
archunit = "1.5.1"
spotless = "8.11.0"
palantir-java-format = "2.103.0"

[libraries]
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
