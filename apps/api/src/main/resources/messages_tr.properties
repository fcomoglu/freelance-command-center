# Server-rendered texts, Turkish. Keep the keys in sync with messages.properties.
identity.mail.verification.subject=E-posta adresinizi doğrulayın
identity.mail.verification.body=Merhaba,\n\nFreelance Command Center hesabınızın e-posta adresini doğrulamak için bu bağlantıyı açın:\n{0}\n\nBağlantı 24 saat geçerlidir. Hesap oluşturmadıysanız bu e-postayı yok sayabilirsiniz.
identity.mail.already-registered.subject=E-posta adresinizle kayıt denemesi
identity.mail.already-registered.body=Merhaba,\n\nBiri bu e-posta adresiyle Freelance Command Center hesabı oluşturmayı denedi, ancak bu adresle bir hesap zaten var. Bu siz idiyseniz buradan giriş yapın veya şifrenizi sıfırlayın:\n{0}\n\nSiz değilseniz bir şey yapmanıza gerek yok.
identity.mail.password-reset.subject=Şifrenizi sıfırlayın
identity.mail.password-reset.body=Merhaba,\n\nFreelance Command Center hesabınız için yeni bir şifre belirlemek üzere bu bağlantıyı kullanın:\n{0}\n\nBağlantı 1 saat geçerlidir. Sıfırlama istemediyseniz bu e-postayı yok sayabilirsiniz; şifreniz değişmez.
