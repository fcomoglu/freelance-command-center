spring:
  application:
    name: fcc-api
  config:
    # Local secrets such as FREELANCER_ACCESS_TOKEN (see .env.example); environment variables work as well.
    import: optional:file:.env[.properties]
  docker:
    compose:
      # Shared local infrastructure; the API is started from apps/api.
      file: ../../infra/compose.yaml
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  web:
    # Fallback when a request has no Accept-Language header; never the server's own locale.
    locale: en
  messages:
    basename: messages
    fallback-to-system-locale: false
  mail:
    # Mailpit from infra/compose.yaml locally; set SPRING_MAIL_* in other environments.
    host: localhost
    port: 1025
  threads:
    virtual:
      enabled: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Stable output so the committed spec only changes when the contract does.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

fcc:
  identity:
    web-base-url: http://localhost:5173
    web-origins:
      - http://localhost:5173
    mail-from: no-reply@freelancecommandcenter.com
  platform:
    freelancer:
      access-token: ${FREELANCER_ACCESS_TOKEN:}
      client-id: ${FREELANCER_CLIENT_ID:}
      client-secret: ${FREELANCER_CLIENT_SECRET:}
    upwork:
      client-id: ${UPWORK_CLIENT_ID:}
      client-secret: ${UPWORK_CLIENT_SECRET:}
      refresh-token: ${UPWORK_REFRESH_TOKEN:}
    mail:
      inbound-domain: ${INBOUND_MAIL_DOMAIN:inbound.localhost}
      webhook-secret: ${INBOUND_MAIL_SECRET:}
    connections:
      redirect-base-url: ${fcc.identity.web-base-url}
      token-key: ${PLATFORM_TOKEN_KEY:}
  notification:
    expo:
      access-token: ${EXPO_ACCESS_TOKEN:}
